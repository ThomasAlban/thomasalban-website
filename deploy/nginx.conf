user app;
worker_processes auto;
worker_shutdown_timeout 25s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Do not log query strings (or request bodies/cookies).
    log_format minimal '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout minimal;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 60m;
    client_body_timeout 30s;
    # Shared budgets, NOT visitor IP limits. Empty keys do not consume a budget.
    map $request_method $post_budget { default ""; POST "all-posts"; }
    map $uri $login_budget { default ""; ~^/admin/login/?$ "admin-login"; }
    limit_req_zone $post_budget zone=posts:1m rate=20r/m;
    limit_req_zone $server_name zone=admin_gate:1m rate=60r/m;
    limit_req_zone $login_budget zone=admin_login:1m rate=6r/m;
    limit_req_status 429;
    server {
        listen 10000;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location /static/ {
            alias /app/staticfiles/;
            autoindex off;
            disable_symlinks on;
            limit_except GET HEAD { deny all; }
        }
        # Only passive media formats are public. No HTML, SVG, JS, or executables.
        # nginx's static module implements HEAD and byte ranges, including audio seeking.
        location ~* ^/media/(?<media_file>.+\.(?:jpg|jpeg|png|gif|webp|avif|mp3|wav|ogg|m4a))$ {
            alias /var/data/media/$media_file;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                audio/mpeg mp3;
                audio/wav wav;
                audio/ogg ogg;
                audio/mp4 m4a;
            }
            autoindex off;
            disable_symlinks on;
            max_ranges 1;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "public, max-age=300" always;
            limit_except GET HEAD { deny all; }
        }
        location /media/ { return 404; }
        # Prefix also gates /admin without slash and prevents regex media bypasses.
        location ^~ /admin {
            auth_basic "Restricted administration";
            auth_basic_user_file /run/admin-gate/htpasswd;
            # nginx auth failures can include the username; suppress those logs.
            error_log /dev/stderr crit;
            limit_req zone=posts burst=10 nodelay;
            limit_req zone=admin_gate burst=30 nodelay;
            limit_req zone=admin_login burst=5 nodelay;
            include /app/deploy/proxy.conf;
        }
        location / {
            limit_req zone=posts burst=10 nodelay;
            include /app/deploy/proxy.conf;
        }
    }
}
