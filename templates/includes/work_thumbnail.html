{% for photo in work.thumbnail_images %}
  <a class="work-card-image" href="{% url 'compositions:detail' slug=work.slug %}" aria-label="View {{ work.title }}">
    <img src="{{ photo.image.url }}" alt="{{ photo.alt_text }}" loading="lazy" decoding="async" width="128" height="96">
  </a>
{% endfor %}
